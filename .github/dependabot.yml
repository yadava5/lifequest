version: 2

# One entry per lockfile that actually gets installed. Dependabot resolves an
# npm ecosystem from the lockfile in `directory`, so pointing it at a folder
# without its own lock produces nothing.
#
# Deliberately NOT covered:
#   - `legacy/` and `legacy/backend/` — the archived CRA + Express + Electron
#     prototype. Both have lockfiles, but nothing builds, deploys, or tests
#     them (`.vercelignore` excludes the whole tree and CI never touches it),
#     so update PRs there would be pure noise against dead code.
#   - docker — the only Dockerfile in the repo is `legacy/backend/Dockerfile`,
#     inside that same archived tree; `docker-compose.dev.yml` is local-dev
#     scaffolding that never ships.

updates:
  # Root npm workspace: covers the root manifest plus apps/* and packages/*,
  # all of which resolve through the single root package-lock.json.
  - package-ecosystem: npm
    directory: /
    # Monthly, not weekly: this cadence governs VERSION updates only. Dependabot
    # SECURITY updates are a separate mechanism unaffected by `schedule`, so
    # vulnerability patches still arrive immediately.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per monthly batch of patch/minor bumps keeps the review surface
      # small; majors still arrive individually because they need a human.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The System Card booklet is not a workspace — it has its own lockfile and is
  # installed with `npm --prefix booklet ci` inside the production build chain
  # (`build:system-card`), so a stale lock here breaks the deploy, not just dev.
  - package-ecosystem: npm
    directory: /booklet
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflow actions are SHA-pinned (Scorecard grades this), which means they
  # can only be refreshed by something that rewrites the pin. That is exactly
  # this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # The github/codeql-action sub-actions (init, analyze, autobuild,
      # upload-sarif) are one action and MUST move in lockstep. Bumping one
      # alone hard-fails CodeQL:
      #   ##[error]Loaded a configuration file for version '4.36.2', but running version '4.37.6'
      # So they get a dedicated group with NO update-types filter — every type,
      # majors included — and it is listed BEFORE the catch-all, because
      # Dependabot assigns each dependency to the FIRST matching group in order.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else: one PR per monthly batch of minor/patch action bumps.
      # Majors stay individual because they need a human.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
