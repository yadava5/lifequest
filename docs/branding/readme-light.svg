      <g transform="translate(96,0)"><path d="M0.28,12.1 L10.72,12.1 A5.35,6.5 0 1 0 8.57,18.82"/></g>
      <g transform="translate(110.4,0)"><path d="M0,5.75 A5.75,5.75 0 0 1 11.5,5.75 L11.5,14.25 A5.75,5.75 0 0 1 0,14.25 Z"/></g>
      <g transform="translate(125.3,0)"><path d="M0.15,7 L0.15,14.6 A5.35,5.4 0 0 0 10.85,14.6"/><path d="M10.85,7 L10.85,20"/></g>
