            "Helvetica Neue", Arial, sans-serif; fill: #546c78; }
  </style>

  <!-- Day panel: warm paper, flat colour (the app's own rule: no gradient branding). -->
  <rect x="1.5" y="1.5" width="757" height="197" rx="16" fill="#faf7f0"
        stroke="#e5ded2" stroke-width="1.5"/>

