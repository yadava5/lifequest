<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200"
     role="img" aria-label="LifeQuest. Built for people rebuilding after job loss or retirement.">
  <title>LifeQuest</title>
  <style>
