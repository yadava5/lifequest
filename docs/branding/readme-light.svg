    <path fill="#2dd4bf" stroke="none" d="M12,8.6 C12.34,10.81 13.19,11.66 15.4,12 C13.19,12.34 12.34,13.19 12,15.4 C11.66,13.19 10.81,12.34 8.6,12 C10.81,11.66 11.66,10.81 12,8.6 Z"/>
    <g fill="none" stroke="#122630" stroke-width="3.2" stroke-linecap="round"
